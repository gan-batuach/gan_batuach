name: publish-release
on:
  push:
    paths: ['release-request.json']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with counted downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python3 -c "import json;print(json.load(open('release-request.json'))['tag'])")
          cp GanBatuach-Setup.exe GanBatuach-Update.exe
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Gan Batuach $TAG" --notes "$TAG" GanBatuach-Setup.exe GanBatuach-Update.exe
